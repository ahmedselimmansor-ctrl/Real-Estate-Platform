# Compose identifies a project by this name, and `--remove-orphans` deletes any
# container carrying it that is not in *this* file. A second project on the same
# machine using `topchoice` therefore reaps this entire stack — containers and
# volumes — the moment it comes up, and this one reaps that stack in return.
# That is not hypothetical: it happened here. Keep this name specific to the
# repository, not to the product.
name: topchoice-realestate

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------------ data ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: topchoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topchoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topchoice_password}
      POSTGRES_DB: ${POSTGRES_DB:-topchoice}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topchoice} -d ${POSTGRES_DB:-topchoice}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [topchoice]
    logging: *default-logging

  mongo:
    image: mongo:7
    container_name: topchoice-mongo
    restart: unless-stopped
    ports: ["${MONGO_HOST_PORT:-27017}:27017"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [topchoice]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: topchoice-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [topchoice]
    logging: *default-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: topchoice-elasticsearch
    restart: unless-stopped
    # Without this the container's hostname is its random id, and log4j resolves
    # that name before Elasticsearch has finished starting. On a busy host the
    # lookup can time out, which log4j treats as fatal:
    #
    #   Could not determine local host name java.net.UnknownHostException:
    #   a8eae19eca49: Temporary failure in name resolution
    #   ERROR: Elasticsearch died while starting up, with exit code 1
    #
    # A fixed hostname is resolvable from the container's own /etc/hosts, so the
    # lookup never leaves the container and cannot time out.
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - bootstrap.memory_lock=true
      # The default watermarks (85/90/95%) assume a cluster that can shuffle
      # shards onto a roomier node. This one is single-node, so on a laptop
      # sitting at 91% full the result is not a rebalance — it is an unassigned
      # shard, a red cluster, and every query coming back as
      # SEARCH_BACKEND_ERROR with the real reason buried in an allocation
      # explain. Pushed out so a full-ish disk degrades instead of breaking.
      - cluster.routing.allocation.disk.watermark.low=93%
      - cluster.routing.allocation.disk.watermark.high=95%
      - cluster.routing.allocation.disk.watermark.flood_stage=97%
      - cluster.routing.allocation.disk.watermark.flood_stage.frozen=97%
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["${ELASTIC_HOST_PORT:-9200}:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [topchoice]
    logging: *default-logging

  # -------------------------------------------------------------- services ---
  api-core:
    build:
      context: ./apps/api-core
      dockerfile: Dockerfile
      target: development
    container_name: topchoice-api-core
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4000
    ports: ["${API_CORE_HOST_PORT:-4000}:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps/api-core/src:/app/src
      - ./apps/api-core/prisma:/app/prisma
      - ./seed:/app/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [topchoice]
    logging: *default-logging

  search-svc:
    build:
      context: ./apps/search-svc
      dockerfile: Dockerfile
    container_name: topchoice-search-svc
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 8000
    ports: ["${SEARCH_SVC_HOST_PORT:-8000}:8000"]
    depends_on:
      elasticsearch: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps/search-svc/app:/app/app
      - ./seed:/app/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [topchoice]
    logging: *default-logging

  rag-svc:
    build:
      context: ./apps/rag-svc
      dockerfile: Dockerfile
    container_name: topchoice-rag-svc
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 8001
    ports: ["${RAG_SVC_HOST_PORT:-8001}:8001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps/rag-svc/app:/app/app
      - ./seed:/app/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [topchoice]
    logging: *default-logging

  reports-svc:
    build:
      context: ./apps/reports-svc
      dockerfile: Dockerfile
    container_name: topchoice-reports-svc
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4567
    ports: ["${REPORTS_SVC_HOST_PORT:-4567}:4567"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./apps/reports-svc/lib:/app/lib
      - ./apps/reports-svc/app.rb:/app/app.rb
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'net/http'; exit(Net::HTTP.get_response(URI('http://localhost:4567/health')).code == '200' ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [topchoice]
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: topchoice-web
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 3000
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on:
      api-core: { condition: service_started }
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    # The Dockerfile declares a HEALTHCHECK only in its production stage, and
    # this service builds the development one — so nginx waiting on
    # `service_healthy` could never be satisfied here. Declaring it in compose
    # covers both targets. `start_period` is generous because the dev server
    # compiles the first route on demand.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [topchoice]
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: topchoice-nginx
    restart: unless-stopped
    ports: ["${HTTP_HOST_PORT:-80}:80", "${HTTPS_HOST_PORT:-443}:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    # nginx resolves its upstreams at start and caches what it finds. Starting
    # as soon as the containers exist — rather than once they answer — is how
    # the stack ends up serving 502s that only a restart clears.
    depends_on:
      web: { condition: service_healthy }
      api-core: { condition: service_healthy }
      search-svc: { condition: service_healthy }
      rag-svc: { condition: service_healthy }
      reports-svc: { condition: service_healthy }
    # The edge is the one component whose failure is total, and it was the only
    # service with nothing watching it. Probes its own config-driven endpoint
    # over TLS, so a bad certificate or a broken server block shows up here
    # rather than as an unexplained connection reset.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -q -O /dev/null https://localhost/__health/nginx || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [topchoice]
    logging: *default-logging

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  es_data:

networks:
  topchoice:
    driver: bridge
