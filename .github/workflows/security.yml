name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Every Monday at 03:17 UTC — off the hour to dodge the scheduler stampede.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ trivy --
  trivy-fs:
    name: Trivy (filesystem + secrets + IaC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — vulnerabilities, secrets and misconfiguration (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
        env:
          TRIVY_SKIP_DB_UPDATE: "false"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy — fail the build on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # --------------------------------------------------------------- gitleaks --
  gitleaks:
    name: Gitleaks (committed secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the upstream image directly: no licence key needed, works on forks.
      - name: Scan git history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
              --source=/repo \
              --redact \
              --verbose \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif

      - name: Scan the working tree (uncommitted / no-git mode)
        if: always()
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
              --source=/repo \
              --no-git \
              --redact \
              --verbose

      - name: Upload gitleaks report
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 14

  # ------------------------------------------------------------- npm audit ---
  npm-audit:
    name: npm audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [api-core, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure a lockfile exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "no package-lock.json — generating one for the audit"
            npm install --package-lock-only --no-audit --no-fund
          fi

      - name: Audit production dependencies (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev dependencies (informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ------------------------------------------------------------- pip audit ---
  pip-audit:
    name: pip-audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [search-svc, rag-svc]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit requirements.txt
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            pip-audit --strict --progress-spinner=off -r requirements.txt
          else
            echo "::warning::apps/${{ matrix.service }}/requirements.txt not found — nothing to audit"
          fi

  # --------------------------------------------------------- bundler audit ---
  bundler-audit:
    name: bundler-audit (reports-svc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/reports-svc
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: apps/reports-svc
          bundler-cache: false

      - name: Install bundler-audit
        run: gem install bundler-audit --no-document

      - name: Ensure Gemfile.lock exists
        run: |
          if [ ! -f Gemfile.lock ]; then
            echo "no Gemfile.lock — resolving dependencies for the audit"
            bundle lock
          fi

      - name: Audit
        run: |
          bundle-audit update
          bundle-audit check --verbose

  # ------------------------------------------------------------------ gate ---
  security-summary:
    name: Security green
    runs-on: ubuntu-latest
    needs: [trivy-fs, gitleaks, npm-audit, pip-audit, bundler-audit]
    if: always()
    steps:
      - name: Summarise
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a security job finished with '$r'"; exit 1 ;;
            esac
          done
          echo "no blocking security findings"
