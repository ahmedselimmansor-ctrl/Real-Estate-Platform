name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  RUBY_VERSION: "3.3"

jobs:
  # ---------------------------------------------------------------- filters --
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api_core: ${{ steps.decide.outputs.api_core }}
      web: ${{ steps.decide.outputs.web }}
      search_svc: ${{ steps.decide.outputs.search_svc }}
      rag_svc: ${{ steps.decide.outputs.rag_svc }}
      reports_svc: ${{ steps.decide.outputs.reports_svc }}
      infra: ${{ steps.decide.outputs.infra }}
      mobile: ${{ steps.decide.outputs.mobile }}
      any_app: ${{ steps.decide.outputs.any_app }}
      python_matrix: ${{ steps.decide.outputs.python_matrix }}
      docker_matrix: ${{ steps.decide.outputs.docker_matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api_core:
              - 'apps/api-core/**'
              - 'seed/**'
              - 'docs/CONTRACT.md'
            web:
              - 'apps/web/**'
              - 'docs/CONTRACT.md'
            search_svc:
              - 'apps/search-svc/**'
              - 'seed/**'
              - 'docs/CONTRACT.md'
            rag_svc:
              - 'apps/rag-svc/**'
              - 'seed/**'
              - 'docs/CONTRACT.md'
            mobile:
              - 'apps/mobile/**'
              - 'docs/CONTRACT.md'
            reports_svc:
              - 'apps/reports-svc/**'
              - 'docs/CONTRACT.md'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'
              - '.env.example'
              - 'Makefile'
              - '.github/workflows/**'

      # Pull requests build only what changed; anything landing on a long-lived
      # branch (or a manual run) always gets the full pipeline.
      - name: Decide what to run
        id: decide
        env:
          FULL: ${{ github.event_name != 'pull_request' }}
          F_API: ${{ steps.filter.outputs.api_core }}
          F_WEB: ${{ steps.filter.outputs.web }}
          F_SEARCH: ${{ steps.filter.outputs.search_svc }}
          F_RAG: ${{ steps.filter.outputs.rag_svc }}
          F_REPORTS: ${{ steps.filter.outputs.reports_svc }}
          F_INFRA: ${{ steps.filter.outputs.infra }}
          F_MOBILE: ${{ steps.filter.outputs.mobile }}
        run: |
          set -euo pipefail
          on() { if [ "$FULL" = "true" ] || [ "$1" = "true" ]; then echo true; else echo false; fi; }

          API=$(on "$F_API");        echo "api_core=$API"        >> "$GITHUB_OUTPUT"
          WEB=$(on "$F_WEB");        echo "web=$WEB"             >> "$GITHUB_OUTPUT"
          SEARCH=$(on "$F_SEARCH");  echo "search_svc=$SEARCH"   >> "$GITHUB_OUTPUT"
          RAG=$(on "$F_RAG");        echo "rag_svc=$RAG"         >> "$GITHUB_OUTPUT"
          REPORTS=$(on "$F_REPORTS");echo "reports_svc=$REPORTS" >> "$GITHUB_OUTPUT"
          INFRA=$(on "$F_INFRA");    echo "infra=$INFRA"         >> "$GITHUB_OUTPUT"
          MOBILE=$(on "$F_MOBILE");  echo "mobile=$MOBILE"       >> "$GITHUB_OUTPUT"

          ANY=false
          for v in "$API" "$WEB" "$SEARCH" "$RAG" "$REPORTS"; do
            [ "$v" = "true" ] && ANY=true
          done
          echo "any_app=$ANY" >> "$GITHUB_OUTPUT"

          PY="[]"
          if [ "$SEARCH" = "true" ] && [ "$RAG" = "true" ]; then PY='["search-svc","rag-svc"]';
          elif [ "$SEARCH" = "true" ]; then PY='["search-svc"]';
          elif [ "$RAG" = "true" ]; then PY='["rag-svc"]'; fi
          echo "python_matrix=$PY" >> "$GITHUB_OUTPUT"

          DOCKER=""
          [ "$API" = "true" ]     && DOCKER="$DOCKER\"api-core\","
          [ "$WEB" = "true" ]     && DOCKER="$DOCKER\"web\","
          [ "$SEARCH" = "true" ]  && DOCKER="$DOCKER\"search-svc\","
          [ "$RAG" = "true" ]     && DOCKER="$DOCKER\"rag-svc\","
          [ "$REPORTS" = "true" ] && DOCKER="$DOCKER\"reports-svc\","
          echo "docker_matrix=[${DOCKER%,}]" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------- api-core --
  api-core:
    name: api-core (NestJS)
    needs: changes
    if: needs.changes.outputs.api_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api-core

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: topchoice
          POSTGRES_PASSWORD: topchoice_password
          POSTGRES_DB: topchoice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U topchoice -d topchoice"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://topchoice:topchoice_password@localhost:5432/topchoice?schema=public
      MONGO_URI: mongodb://localhost:27017/topchoice_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long-00000
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      JWT_ISSUER: topchoice-api
      JWT_AUDIENCE: topchoice-clients
      INTERNAL_SERVICE_TOKEN: ci-internal-token
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-api-core-${{ runner.os }}-${{ hashFiles('apps/api-core/package-lock.json') }}
          restore-keys: npm-api-core-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Generate Prisma client
        run: npx --yes prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Apply migrations
        run: npx --yes prisma migrate deploy

      - name: Test
        run: npm test -- --ci --runInBand

  # -------------------------------------------------------------------- web --
  web:
    name: web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_SEARCH_URL: /api/search
      NEXT_PUBLIC_CHAT_URL: /api/chat
      NEXT_PUBLIC_REPORTS_URL: /api/reports
      NEXT_PUBLIC_SITE_URL: https://localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm + next caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            apps/web/.next/cache
          key: npm-web-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: npm-web-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ------------------------------------------------------- python services ---
  python:
    name: ${{ matrix.service }} (FastAPI)
    needs: changes
    if: needs.changes.outputs.python_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.python_matrix) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: topchoice
          POSTGRES_PASSWORD: topchoice_password
          POSTGRES_DB: topchoice_rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U topchoice -d topchoice_rag"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 10

    env:
      APP_ENV: test
      ELASTICSEARCH_URL: http://localhost:9200
      ES_INDEX: properties
      ES_INDEX_VERSION: properties_v1
      MONGO_URI: mongodb://localhost:27017/topchoice
      REDIS_URL: redis://localhost:6379
      RAG_DATABASE_URL: postgresql+asyncpg://topchoice:topchoice_password@localhost:5432/topchoice_rag
      RAG_DATABASE_URL_SYNC: postgresql://topchoice:topchoice_password@localhost:5432/topchoice_rag
      JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long-000000
      JWT_ISSUER: topchoice-api
      JWT_AUDIENCE: topchoice-clients
      INTERNAL_SERVICE_TOKEN: ci-internal-token
      DASHSCOPE_API_KEY: ""
      OPENAI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.service }}-${{ runner.os }}-${{ hashFiles(format('apps/{0}/requirements*.txt', matrix.service)) }}
          restore-keys: pip-${{ matrix.service }}-${{ runner.os }}-

      - name: Start Elasticsearch
        if: matrix.service == 'search-svc'
        run: |
          docker run -d --name es \
            -p 9200:9200 \
            -e discovery.type=single-node \
            -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx1g" \
            docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9200/_cluster/health >/dev/null 2>&1; then
              echo "elasticsearch is up"; break
            fi
            sleep 5
          done

      - name: Start MongoDB
        if: matrix.service == 'search-svc'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7
          sleep 5

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          # Only fill gaps. This line used to install ruff and mypy unpinned,
          # after requirements-dev.txt had already pinned ruff==0.8.4 — so the
          # pin was overwritten with whatever was newest that morning, and a
          # ruff release shipping a new rule would fail a commit that changed
          # nothing. Linters have to be reproducible or the gate is noise.
          pip install pytest pytest-asyncio httpx
          true

      - name: Ruff
        run: python -m ruff check app

      - name: Ruff format check
        run: python -m ruff format --check app
        continue-on-error: true

      - name: Mypy
        run: python -m mypy app

      - name: Pytest
        run: python -m pytest -q --maxfail=1

  # ------------------------------------------------------------ reports-svc --
  reports-svc:
    name: reports-svc (Sinatra)
    needs: changes
    if: needs.changes.outputs.reports_svc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/reports-svc

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: topchoice
          POSTGRES_PASSWORD: topchoice_password
          POSTGRES_DB: topchoice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U topchoice -d topchoice"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 10

    env:
      APP_ENV: test
      RACK_ENV: test
      DATABASE_URL: postgresql://topchoice:topchoice_password@localhost:5432/topchoice
      MONGO_URI: mongodb://localhost:27017/topchoice
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long-000000
      JWT_ISSUER: topchoice-api
      JWT_AUDIENCE: topchoice-clients

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          working-directory: apps/reports-svc
          bundler-cache: false

      - name: Restore bundler cache
        uses: actions/cache@v4
        with:
          path: apps/reports-svc/vendor/bundle
          key: bundle-${{ runner.os }}-${{ hashFiles('apps/reports-svc/Gemfile*') }}
          restore-keys: bundle-${{ runner.os }}-

      - name: Bundle install
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: RuboCop
        run: bundle exec rubocop --format github

      - name: RSpec
        run: bundle exec rspec --format progress

  # ------------------------------------------------------------------ infra --
  infra:
    name: infra (shell + nginx)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning infra/scripts/*.sh infra/scripts/lib/*.sh

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Generate certificates
        run: ./infra/scripts/gen-certs.sh --quiet

      - name: Validate the nginx configuration
        run: |
          docker run --rm \
            --add-host web:127.0.0.1 \
            --add-host api-core:127.0.0.1 \
            --add-host search-svc:127.0.0.1 \
            --add-host rag-svc:127.0.0.1 \
            --add-host reports-svc:127.0.0.1 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infra/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/infra/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

      - name: Makefile help renders
        run: make help

  # ----------------------------------------------------------- docker build --
  # ----------------------------------------------------------------- mobile --
  mobile:
    name: Flutter (analyze + test)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        # `--set-exit-if-changed` makes an unformatted file a build failure
        # rather than a diff someone notices three PRs later.
        run: dart format --output=none --set-exit-if-changed --line-length 100 lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  docker-build:
    name: docker build (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.docker_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.docker_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          load: false
          tags: topchoice/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------- integration -
  compose-smoke:
    name: integration (composed stack)
    needs: [changes, docker-build]
    if: always() && needs.changes.outputs.any_app == 'true' && needs.docker-build.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Prepare .env and certificates
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 32)|"   .env
          sed -i "s|^JWT_REFRESH_SECRET=.*|JWT_REFRESH_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^INTERNAL_SERVICE_TOKEN=.*|INTERNAL_SERVICE_TOKEN=$(openssl rand -hex 24)|" .env
          ./infra/scripts/gen-certs.sh --quiet

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the stack to become healthy
        run: |
          set -uo pipefail
          for attempt in $(seq 1 40); do
            if ./infra/scripts/health-check.sh --quiet --timeout 10 >/dev/null 2>&1; then
              echo "stack healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "waiting for the stack... (${attempt}/40)"
            sleep 15
          done
          echo "::error::the stack never became healthy"
          exit 1

      - name: Health check table
        run: ./infra/scripts/health-check.sh

      # A stack that starts is not a stack that works. Seed it, index it, and
      # let the integration suite exercise the real journeys — the previous
      # smoke test only proved the containers were alive.
      - name: Seed the catalogue
        run: docker compose exec -T api-core sh -lc 'npm run seed'

      - name: Build the search index
        run: |
          set -euo pipefail
          token=$(grep '^INTERNAL_SERVICE_TOKEN=' .env | cut -d= -f2-)
          curl -fsSk -X POST https://localhost/api/search/reindex \
            -H 'Content-Type: application/json' \
            -H "X-Service-Token: ${token}" \
            -d '{"full": true}' >/dev/null
          # The reindex is queued; wait for the index to match the catalogue.
          for attempt in $(seq 1 40); do
            indexed=$(curl -sk 'https://localhost/api/search?limit=1' | jq -r '.meta.total // 0')
            published=$(curl -sk 'https://localhost/api/v1/properties?limit=1' | jq -r '.meta.total // 0')
            if [ "$indexed" != "0" ] && [ "$indexed" = "$published" ]; then
              echo "indexed ${indexed}/${published}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the index never caught up with the catalogue"
          exit 1

      - name: Set up Node for the integration suite
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/integration/package-lock.json

      - name: Integration tests
        run: |
          cd tests/integration
          npm ci --no-audit --no-fund
          npm test

      # The mobile client is the only consumer whose parsing is never exercised
      # by the suite above, and it reads the same services. Driving the real app
      # here is what catches a payload the app cannot render.
      - name: Set up Flutter for the end-to-end suite
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mobile end-to-end against the running stack
        working-directory: apps/mobile
        run: |
          flutter pub get
          # flutter-tester, not an emulator: dart:io is real on the host VM, so
          # the HTTP is real. Without the flag Flutter selects Chrome and bails
          # with "Web devices are not supported for integration tests yet".
          flutter test integration_test -d flutter-tester \
            --dart-define=API_CORE_URL=http://localhost:4000/api/v1 \
            --dart-define=SEARCH_URL=http://localhost:8000/api/search \
            --dart-define=CHAT_URL=http://localhost:8001/api/chat \
            --dart-define=REPORTS_URL=http://localhost:4567/api/reports \
            --dart-define=MEDIA_ORIGIN=http://localhost:3000

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: tests/integration/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  # ------------------------------------------------------------------- gate --
  ci-success:
    name: CI green
    runs-on: ubuntu-latest
    needs: [changes, api-core, web, python, reports-svc, mobile, infra, docker-build, compose-smoke]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job finished with '$r'"; exit 1 ;;
            esac
          done
          echo "all jobs green"
