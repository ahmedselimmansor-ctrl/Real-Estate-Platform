# =============================================================================
# TopChoice — nginx main configuration
#
# Mounted read-only by docker-compose at /etc/nginx/nginx.conf.
# Virtual hosts live in ./conf.d/topchoice.conf, reusable fragments in
# ./conf.d/snippets/*.inc (only *.conf is auto-included, so .inc files are
# opt-in via an explicit `include`).
#
# Routing contract (docs/CONTRACT.md §1):
#   /              -> web:3000
#   /api/v1/       -> api-core:4000
#   /api/search/   -> search-svc:8000
#   /api/chat/     -> rag-svc:8001
#   /api/reports/  -> reports-svc:4567
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # ---------------------------------------------------------------- maps --
    # X-Request-Id: honour the caller's value, otherwise mint one from nginx's
    # built-in $request_id. Every service reads/propagates it (CONTRACT §4).
    map $http_x_request_id $req_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    # WebSocket / HTTP upgrade passthrough (Next.js HMR, future ws endpoints).
    # The empty branch is deliberately "" and not the more common "close": an
    # empty `proxy_set_header Connection ""` makes nginx omit the header
    # entirely, which is what keeps the upstream keepalive pools in
    # conf.d/topchoice.conf alive for ordinary (non-upgrade) requests.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       "";
    }

    # Keep health probes out of the access log so `make logs` stays readable.
    map $request_uri $log_request {
        default              1;
        "~^/__health"        0;
        "~^/api/[a-z]+/health" 0;
    }

    # Content-Security-Policy. Next.js dev needs 'unsafe-inline' + 'unsafe-eval'
    # (React refresh / turbopack runtime). Image hosts match the seed dataset
    # (Unsplash, Picsum) plus S3/CloudFront delivery and the map tile providers.
    # Tighten script-src to nonces/hashes before any real production deploy.
    map $host $topchoice_csp {
        default "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; script-src-elem 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.unsplash.com https://picsum.photos https://*.picsum.photos https://*.amazonaws.com https://*.cloudfront.net https://api.mapbox.com https://*.mapbox.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; media-src 'self' blob: data:; connect-src 'self' https://api.mapbox.com https://events.mapbox.com ws: wss:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; upgrade-insecure-requests";
    }

    # --------------------------------------------------------------- logging -
    log_format json_access escape=json
        '{'
          '"time":"$time_iso8601",'
          '"level":"info",'
          '"service":"nginx",'
          '"route":"$route_service",'
          '"requestId":"$req_id",'
          '"remoteAddr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytesSent":$body_bytes_sent,'
          '"requestLength":$request_length,'
          '"requestTime":$request_time,'
          '"upstreamAddr":"$upstream_addr",'
          '"upstreamStatus":"$upstream_status",'
          '"upstreamTime":"$upstream_response_time",'
          '"scheme":"$scheme",'
          '"host":"$host",'
          '"protocol":"$server_protocol",'
          '"referer":"$http_referer",'
          '"userAgent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_access if=$log_request;

    # ----------------------------------------------------------------- core --
    server_tokens        off;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    types_hash_max_size  4096;
    server_names_hash_bucket_size 128;
    absolute_redirect    off;

    keepalive_timeout    65s;
    keepalive_requests   1000;
    reset_timedout_connection on;

    client_max_body_size     25m;
    client_body_buffer_size  256k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_header_timeout    30s;
    client_body_timeout      60s;
    send_timeout             60s;

    # Docker's embedded DNS. Backends are addressed by compose service name;
    # `valid=10s` bounds how long a resolved address is cached for any
    # runtime (variable-based) resolution. Names inside `upstream` blocks are
    # resolved at startup/reload — after recreating a backend container with a
    # new IP, `make restart` (or `docker compose restart nginx`) re-resolves.
    resolver         127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ----------------------------------------------------------------- gzip --
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.api+json
        application/x-javascript
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/csv
        text/javascript
        text/markdown
        text/plain
        text/xml;

    # ---------------------------------------------------------- rate limits --
    # CONTRACT §10.4 — rate limit auth + chat (+ a generous global API bucket).
    # Zones are keyed on the client IP; `limit_req_status 429` pairs with the
    # JSON error envelope declared in conf.d/snippets/error-envelope.inc.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=20r/m;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=20r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # ------------------------------------------------------------------ TLS --
    # Self-signed localhost certificate generated by infra/scripts/gen-certs.sh.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # A self-signed certificate has no OCSP responder — stapling must be off or
    # every handshake pays a failed lookup.
    ssl_stapling              off;
    ssl_stapling_verify       off;

    include /etc/nginx/conf.d/*.conf;
}
