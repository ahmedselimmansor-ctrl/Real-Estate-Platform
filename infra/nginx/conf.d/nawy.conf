# =============================================================================
# Nawy Clone — public edge (TLS termination + path routing)
#
#   http://localhost   -> 301 https://localhost      (except ACME challenges)
#   https://localhost  -> web / api-core / search-svc / rag-svc / reports-svc
#
# See docs/CONTRACT.md §1 for the authoritative route table.
# =============================================================================

# ------------------------------------------------------------------ upstreams
# Keep-alive pools cut a TCP+handshake round trip off every proxied request.
# `zone` keeps upstream state in shared memory across worker processes.
upstream nawy_web {
    zone nawy_web 64k;
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream nawy_api_core {
    zone nawy_api_core 64k;
    server api-core:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream nawy_search_svc {
    zone nawy_search_svc 64k;
    server search-svc:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

upstream nawy_rag_svc {
    zone nawy_rag_svc 64k;
    server rag-svc:8001 max_fails=3 fail_timeout=10s;
    keepalive 16;
    keepalive_timeout 75s;
    keepalive_requests 1000;
}

upstream nawy_reports_svc {
    zone nawy_reports_svc 64k;
    server reports-svc:4567 max_fails=3 fail_timeout=10s;
    keepalive 8;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# ============================================================== HTTP :80 =====
# Redirect everything to HTTPS. The ACME challenge path is served in the clear
# so a real certificate can be issued later without touching this file.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    set $route_service "redirect";

    # Certbot webroot (empty in local dev — present so prod needs no edit).
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root         /var/www/certbot;
        access_log   off;
        try_files    $uri =404;
    }

    location = /__health/nginx {
        default_type application/json;
        access_log   off;
        return 200 '{"status":"ok","service":"nginx","version":"1.0.0","deps":{"tls":"redirect-only"}}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================= HTTPS :443 ====
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name localhost _;

    # Generated by infra/scripts/gen-certs.sh (SANs: localhost, *.localhost,
    # 127.0.0.1, ::1). Regenerate with `make certs`.
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Defaults for anything that does not `set` its own value (see log_format).
    set $route_service "edge";

    # Global safety valve — a single IP may not hog the whole worker pool.
    limit_conn conn_per_ip 128;

    root /usr/share/nginx/html;

    # JSON error envelope + friendly offline page (named locations).
    include /etc/nginx/conf.d/snippets/error-envelope.inc;

    # --------------------------------------------------------------- health --
    # Contract health endpoints are per-service on their own port; these proxy
    # aliases let infra/scripts/health-check.sh probe each backend *through*
    # the edge without colliding with any application route.
    location = /__health/nginx {
        default_type application/json;
        access_log   off;
        add_header   Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"nginx","version":"1.0.0","deps":{"tls":"self-signed"}}';
    }

    location = /__health/web {
        access_log off;
        set $route_service "web";
        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        proxy_pass http://nawy_web/;
    }

    location = /__health/api-core {
        access_log off;
        set $route_service "api-core";
        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        proxy_pass http://nawy_api_core/health;
    }

    location = /__health/search-svc {
        access_log off;
        set $route_service "search-svc";
        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        proxy_pass http://nawy_search_svc/health;
    }

    location = /__health/rag-svc {
        access_log off;
        set $route_service "rag-svc";
        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        proxy_pass http://nawy_rag_svc/health;
    }

    location = /__health/reports-svc {
        access_log off;
        set $route_service "reports-svc";
        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        proxy_pass http://nawy_reports_svc/health;
    }

    # ------------------------------------------------- api-core  /api/v1/* ---
    # Auth routes get their own (much tighter) bucket — CONTRACT §10.4.
    location ^~ /api/v1/auth/ {
        set $route_service "api-core";
        limit_req zone=auth_limit burst=10 nodelay;

        error_page 429     = @error_rate_limited;
        error_page 413     = @error_payload_too_large;
        error_page 502 503 = @error_service_unavailable;
        error_page 504     = @error_gateway_timeout;

        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        include /etc/nginx/conf.d/snippets/security-headers.inc;
        proxy_set_header Connection "";

        # OAuth round trips can be slow (Google token exchange).
        proxy_read_timeout 30s;
        # Never cache a credential exchange.
        proxy_cache off;
        add_header Cache-Control "no-store" always;

        proxy_pass http://nawy_api_core;
    }

    location ^~ /api/v1/ {
        set $route_service "api-core";
        limit_req zone=api_limit burst=60 nodelay;

        error_page 429     = @error_rate_limited;
        error_page 413     = @error_payload_too_large;
        error_page 502 503 = @error_service_unavailable;
        error_page 504     = @error_gateway_timeout;

        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        include /etc/nginx/conf.d/snippets/security-headers.inc;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_pass http://nawy_api_core;
    }

    # Convenience aliases. api-core mounts Swagger UI at /api/v1/docs
    # (SWAGGER_PATH = `${API_PREFIX}/docs`), so /docs is just a short link.
    location = /docs {
        set $route_service "redirect";
        return 301 https://$host/api/v1/docs;
    }

    location = /api-docs {
        set $route_service "redirect";
        return 301 https://$host/api/v1/docs;
    }

    # ----------------------------------------------- search-svc /api/search --
    location ^~ /api/search/ {
        set $route_service "search-svc";
        limit_req zone=search_limit burst=40 nodelay;

        error_page 429     = @error_rate_limited;
        error_page 413     = @error_payload_too_large;
        error_page 502 503 = @error_service_unavailable;
        error_page 504     = @error_gateway_timeout;

        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        include /etc/nginx/conf.d/snippets/security-headers.inc;
        proxy_set_header Connection "";

        # A full reindex is a long POST — allow it to run to completion.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://nawy_search_svc;
    }

    # Bare `/api/search` (no trailing slash) is the primary search endpoint.
    location = /api/search {
        set $route_service "search-svc";
        limit_req zone=search_limit burst=40 nodelay;

        error_page 429     = @error_rate_limited;
        error_page 502 503 = @error_service_unavailable;
        error_page 504     = @error_gateway_timeout;

        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        include /etc/nginx/conf.d/snippets/security-headers.inc;
        proxy_set_header Connection "";
        proxy_pass http://nawy_search_svc;
    }

    # -------------------------------------------------- rag-svc /api/chat ----
    # SSE lives here: buffering off, chunked on, 10 minute read timeout.
    location ^~ /api/chat/ {
        set $route_service "rag-svc";
        limit_req zone=chat_limit burst=20 nodelay;

        error_page 429     = @error_rate_limited;
        error_page 413     = @error_payload_too_large;
        error_page 502 503 = @error_service_unavailable;
        error_page 504     = @error_gateway_timeout;

        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        include /etc/nginx/conf.d/snippets/proxy-sse.inc;
        include /etc/nginx/conf.d/snippets/security-headers.inc;
        proxy_set_header Connection "";

        add_header Cache-Control "no-cache, no-transform" always;

        proxy_pass http://nawy_rag_svc;
    }

    # --------------------------------------------- reports-svc /api/reports --
    # PDF/CSV generation is CPU-bound and streams a file back.
    location ^~ /api/reports/ {
        set $route_service "reports-svc";
        limit_req zone=api_limit burst=30 nodelay;

        error_page 429     = @error_rate_limited;
        error_page 413     = @error_payload_too_large;
        error_page 502 503 = @error_service_unavailable;
        error_page 504     = @error_gateway_timeout;

        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        include /etc/nginx/conf.d/snippets/security-headers.inc;
        proxy_set_header Connection "";

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_max_temp_file_size 128m;

        proxy_pass http://nawy_reports_svc;
    }

    # ------------------------------------------------------------- next.js ---
    # Static chunks + HMR websocket (`/_next/webpack-hmr`, turbopack included).
    location ^~ /_next/ {
        set $route_service "web";
        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        include /etc/nginx/conf.d/snippets/security-headers.inc;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering  off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        error_page 502 503 504 = @web_unavailable;

        proxy_pass http://nawy_web;
    }

    # Everything else is the Next.js app (SSR, RSC payloads, app routes).
    location / {
        set $route_service "web";
        include /etc/nginx/conf.d/snippets/proxy-common.inc;
        include /etc/nginx/conf.d/snippets/security-headers.inc;

        # WebSocket upgrade so React Fast Refresh works through the proxy.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        error_page 502 503 504 = @web_unavailable;

        proxy_pass http://nawy_web;
    }
}
