AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'config/puma.rb'

# --- layout -----------------------------------------------------------------
Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'routes/**/*'
    - 'app.rb'





Metrics/ClassLength:
  Max: 300

Metrics/ModuleLength:
  Max: 400

Metrics/ParameterLists:
  Max: 8
  MaxOptionalParameters: 5

# --- style ------------------------------------------------------------------
Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/RaiseArgs:
  # `raise Errors::ValidationError.new(msg, details: [...])` is deliberate:
  # our errors carry structured payloads.
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Naming/MethodParameterName:
  AllowedNames: [id, to, at, io, on, up, ip]

Naming/VariableNumber:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

# --- where size is inherent, not sloppiness ---------------------------------
# These methods are long because the thing they describe is long: a PDF laid
# out element by element, a SQL query assembled from a dozen optional filters,
# a CSV column map. Splitting them into helpers that are each called once
# scatters a single linear procedure across a file and makes it harder to
# follow, not easier. The cops stay on everywhere else.
Metrics/AbcSize:
  Max: 45
  Exclude:
    - 'routes/**/*'
    - 'lib/pdf/**/*'
    - 'lib/finance.rb'
    - 'lib/reports/exports.rb'
    - 'lib/reports/market_report.rb'
    - 'lib/repositories/**/*'

Metrics/MethodLength:
  Max: 45
  Exclude:
    - 'lib/pdf/**/*'
    - 'lib/finance.rb'
    - 'lib/reports/exports.rb'
    - 'lib/reports/market_report.rb'
    - 'lib/repositories/**/*'
    - 'routes/**/*'

Metrics/CyclomaticComplexity:
  Max: 15
  Exclude:
    - 'lib/reports/exports.rb'
    - 'lib/repositories/**/*'

Metrics/PerceivedComplexity:
  Max: 15
  Exclude:
    - 'lib/reports/exports.rb'
    - 'lib/repositories/**/*'

# A `case` over types where several arms legitimately share a body; merging
# them would obscure which types are actually handled.
Lint/DuplicateBranch:
  Exclude:
    - 'lib/finance.rb'
